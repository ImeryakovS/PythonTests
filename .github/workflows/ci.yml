name: Run PyTests
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Setup Grafana from Docker
jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: install docker compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.22.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

        # Setup Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

        # Setup Allure
      - name: Install Allure CLI
        run: |
          sudo apt update
          sudo apt install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

        # Full cleanup before start build
      - name: Full cleanup (local volumes and reports)
        run: |
          docker-compose down -v --remove-orphans || true
          rm -rf allure-results allure-report gh-pages || true

        # Start test runner
      - name: Build test-runner container
        run: docker build -t test-runner .

      # Start Grafana
      - name: Wait for Grafana to be ready
        run: |
          for i in {1..60}; do
          result=$(curl -s http://localhost:3000/api/health || true)
          echo "Health check $i: $result"
  
          if echo "$result" | grep -q '"database":"ok"'; then
           echo "✅ Grafana is ready!"
           break
          fi
  
          sleep 2
          done
          
          # Final check
          if ! echo "$result" | grep -q '"database":"ok"'; then
          echo '❌ Grafana did not start in time!'
          docker-compose logs grafana
          exit 1
          fi

        #Run tests
      - name: Run tests
        id: tests
        run: |
          docker run --rm \
            -v grafana-data:/var/lib/grafana \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/allure-report:/app/allure-report \
            -e GRAFANA_DB_PATH=/var/lib/grafana/grafana.db \
            -e GRAFANA_BASE_URL=http://localhost:3000 \
            test-runner \
            pytest /app/tests --alluredir=/app/allure-results
        continue-on-error: true

      - name: Clean up containers
        run: docker-compose down -v --remove-orphans

