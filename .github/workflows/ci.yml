name: Run PyTests
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Setup Grafana from Docker
jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: install docker compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.22.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

        # Setup Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

        # Setup Allure
      - name: Install Allure CLI
        run: |
          sudo apt update
          sudo apt install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # Wait grafana starts
      - name: Wait for Grafana
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 | grep "Found"; then
              echo "Grafana is ready!"
              exit 0
            fi
            echo "Waiting for Grafana to start..."
            sleep 2
          done
          echo "Grafana did not start in time!" && exit 1

      - name: Run tests with docker-compose
        id: tests
        run: docker-compose up --abort-on-container-exit --exit-code-from test-runner
        continue-on-error: true

      # Clone allure history for allure
      - name: Clone gh-pages branch
        if: always()
        run: |
          git clone --depth 1 --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages

      # Restore history from previous report
      - name: Restore history from previous report
        if: always()
        run: |
          if [ -d gh-pages/allure-report/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/allure-report/history/* allure-results/history/
          fi

      # Generate Allure reports
      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report
        continue-on-error: true

      #Deploy allure reports to Pages
      - name: Deploy Allure report to GitHub Pages
        if: steps.tests.outcome == 'success' || steps.tests.outcome == 'failure'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          cd gh-pages
          rm -rf allure-report
          cp -r ../allure-report ./allure-report
          touch .nojekyll
          
          git add .
          git commit -m "🚀 Update Allure report"
          git push origin gh-pages

      # Final Clean up
      - name: Clean up containers
        run: docker-compose down